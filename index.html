<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bot Arena: Career</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a0c0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bot Arena">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c0f;--panel:#12161c;--panel2:#181e26;--line:#262f3b;--text:#e2e7ee;--dim:#8592a3;--amber:#ffb020;--teal:#3ee6c1;--red:#ff3b5c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Chakra Petch',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
.mono{font-family:'JetBrains Mono',monospace}
.screen{position:absolute;inset:0;display:none;overflow-y:auto;padding:58px 0 84px;background:radial-gradient(900px 500px at 85% -10%,#1d2633 0%,transparent 60%),linear-gradient(#0000,#0000),var(--bg)}
.screen.on{display:block}
.screen::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff03 3px 4px);z-index:0}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px;position:relative;z-index:1}
#topbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:10;display:flex;align-items:center;gap:12px;padding:0 14px;background:linear-gradient(#0d1116,#0b0e12);border-bottom:1px solid var(--line)}
#topbar .team{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .team small{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.1em;font-weight:500}
.pill{font-family:'JetBrains Mono';font-size:13px;padding:5px 9px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.pill.cr{color:var(--amber)}
.pill.fm{color:#c9a7ff}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:#0b0e12f2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(6px)}
#nav button{flex:1;padding:10px 0 9px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px}
#nav button i{font-style:normal;font-size:19px;line-height:1}
#nav button.on{color:var(--amber)}
h2{font-size:22px;letter-spacing:.08em;text-transform:uppercase}
h3{font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.sect{margin:18px 0 9px;display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px;position:relative}
.btn{padding:12px 18px;border-radius:10px;font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel2)}
.btn.primary{background:linear-gradient(#ffc040,#f09a10);color:#1a1205;border-color:#ffb020;box-shadow:0 0 24px #ffb02030}
.btn.small{padding:8px 12px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:#4a2230}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.dim{color:var(--dim)}
.small{font-size:12px}
.tag{display:inline-block;font-size:10.5px;padding:2px 6px;border-radius:4px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13.5px;color:var(--dim)}
.chip.on{border-color:var(--amber);color:var(--text);background:#2a2110}
.bar{height:7px;background:#0005;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--teal)}
.bar.warn i{background:var(--amber)}.bar.over i{background:var(--red)}
/* career */
.league{display:flex;gap:14px;align-items:center}
.league .crest{width:60px;height:60px;border-radius:12px;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 35% 30%,#3a4554,#11161d);border:1px solid var(--line);flex:none}
.ladder{display:flex;gap:6px;margin-top:12px}
.ladder div{flex:1;text-align:center;font-size:10.5px;padding:7px 2px;border-radius:7px;border:1px solid var(--line);background:#0d1116;color:var(--dim);line-height:1.25;min-width:0;overflow:hidden}
.ladder div.done{color:var(--teal);border-color:#1f5a4e}
.ladder div.cur{color:var(--amber);border-color:var(--amber);background:#2a2110}
.ladder div.champ{border-style:dashed}
.next{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.trophies{display:flex;gap:8px;flex-wrap:wrap}
.trophy{font-size:12px;padding:6px 9px;border-radius:8px;background:#2a2110;border:1px solid #5a4210;color:var(--amber)}
.log div{font-size:12.5px;padding:7px 0;border-top:1px solid var(--line);display:flex;gap:8px}
.log div:first-child{border-top:none}
/* bots */
.bots{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.bot{display:flex;gap:11px;align-items:center;text-align:left;width:100%}
.bot canvas{width:84px;height:84px;flex:none;border-radius:9px;background:radial-gradient(circle,#232a33,#0c0f13);border:1px solid var(--line)}
.bot .nm{font-weight:700;font-size:16.5px;line-height:1.15}
.bot .ep{font-size:11.5px;color:var(--amber);font-style:italic}
.bot .ln{font-size:12px;color:var(--dim);line-height:1.45}
.bot.add{justify-content:center;border-style:dashed;color:var(--dim);min-height:108px;letter-spacing:.1em}
.rank{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.warnline{color:var(--red);font-size:11.5px}
/* modal */
.modal{position:fixed;inset:0;background:#000b;display:none;z-index:30;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{width:100%;max-width:760px;max-height:92vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.modal.center{align-items:center}.modal.center .sheet{border-radius:16px;width:min(620px,95vw)}
@media(min-width:780px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:sticky;top:-14px;background:var(--panel);padding:8px 0;z-index:2}
/* builder */
#builder{position:fixed;inset:0;z-index:25;background:var(--bg);display:none;overflow-y:auto}
#builder.on{display:block}
.bhead{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;padding:10px 12px;background:#0b0e12f0;border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bhead input{flex:1;min-width:0;background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--text);font:700 17px 'Chakra Petch'}
.bgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:860px){.bgrid{grid-template-columns:380px 1fr}.bstick{position:sticky;top:64px;align-self:start}}
#bPrev{width:100%;aspect-ratio:1/1;max-height:380px;display:block;border-radius:12px;border:1px solid var(--line);background:radial-gradient(circle at 50% 45%,#2b3038 0%,#15191e 55%,#0b0d10 100%)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px;margin-top:10px;font-size:12px}
.stat .k{color:var(--dim);display:flex;justify-content:space-between;gap:4px}
.stat .k b{color:var(--text);font-family:'JetBrains Mono';font-weight:600}
.stat .bar{height:5px;margin-top:3px}
.meter{margin-top:8px;font-size:12px}
.meter .k{display:flex;justify-content:space-between;color:var(--dim)}
.meter .k b{font-family:'JetBrains Mono';color:var(--text);font-weight:600}
.warns{margin-top:8px}
.warns div{font-size:12px;color:var(--red);padding:2px 0}
.warns div.y{color:var(--amber)}
.slot{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:6px}
.slot canvas{width:48px;height:48px;border-radius:7px;flex:none}
.slot .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.slot .pn{font-weight:600;font-size:14.5px}
.slot .af{font-size:11.5px;color:#9db8d8}
.slot.empty .pn{color:var(--dim);font-weight:500}
.slot .sz{font-family:'JetBrains Mono';font-size:11px;padding:1px 5px;border-radius:4px;background:#0d1116;border:1px solid var(--line);color:var(--amber)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:7px;border:2px solid #0006;box-shadow:inset 0 2px 4px #fff3,inset 0 -3px 5px #0006}
.sw.on{outline:2px solid #fff;outline-offset:1px}
.slider{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:8px}
.slider input{flex:1;accent-color:var(--amber)}
.slider b{font-family:'JetBrains Mono';min-width:44px;text-align:right}
.optgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.opt{text-align:left;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.opt.on{border-color:var(--amber);background:#2a2110}
.opt b{font-size:13.5px;display:block}
.opt small{color:var(--dim);font-size:11px;line-height:1.3;display:block;margin-top:2px}
/* part rows */
.prow{display:flex;gap:10px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:6px;width:100%;text-align:left}
.prow canvas{width:52px;height:52px;border-radius:8px;flex:none}
.prow .pn{font-weight:600;font-size:14.5px;line-height:1.2}
.prow .st{font-size:11.5px;color:var(--dim);line-height:1.4;margin-top:1px}
.prow .af{font-size:11.5px;color:#9db8d8}
.prow .pr{font-family:'JetBrains Mono';font-size:13px;color:var(--amber);white-space:nowrap;text-align:right}
.prow.locked{opacity:.45}
.prow.cant .pr{color:var(--red)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12.5px}
.tabs button.on{color:var(--amber);border-color:var(--amber);background:#2a2110}
/* table */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t th{color:var(--dim);font-weight:500;text-align:right;padding:5px 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.t th:first-child,.t td:first-child{text-align:left}
.t td{padding:6px 4px;border-top:1px solid var(--line);text-align:right;font-family:'JetBrains Mono'}
.t td:first-child{font-family:'Chakra Petch';font-weight:600}
.t tr.me td{background:#3ee6c10d}
.t .grp td{color:var(--dim);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-family:'Chakra Petch';border:none;padding-top:12px}
.t .ko{opacity:.55}
.up{color:var(--teal)}.down{color:var(--red)}
/* scout */
.scout{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.scout .bot canvas{width:70px;height:70px}
.pick{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:6px;width:100%;text-align:left}
.pick canvas{width:60px;height:60px;border-radius:8px;flex:none;background:radial-gradient(circle,#232a33,#0c0f13)}
.pick.on{border-color:var(--teal);background:#0f2621}
.pick.bad{opacity:.5}
.check{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:var(--teal)}
.pick.on .check{border-color:var(--teal)}
/* battle */
#battle{background:#050607;padding:0;overflow:hidden}
#battle::before{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.hud{position:absolute;left:0;right:0;top:0;padding:7px 10px;display:flex;align-items:center;gap:10px;pointer-events:none;background:linear-gradient(180deg,#000d,transparent)}
.side{flex:1;min-width:0}
.side .t{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
.side .t span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .bar{height:7px;margin-top:4px}
.side.e .t{flex-direction:row-reverse}
.side.e .bar i{background:var(--red);margin-left:auto}
.clock{font-family:'JetBrains Mono';font-size:15px;min-width:64px;text-align:center}
.clock small{display:block;font-size:9px;color:#d080ff;letter-spacing:.1em;font-family:'Chakra Petch'}
.ctrls{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#0b1017dd;border:1px solid var(--line);border-radius:12px;padding:5px}
.ctrls button{padding:8px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--dim)}
.ctrls button.on{background:var(--panel2);color:var(--amber)}
.feed{position:absolute;right:10px;top:48px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none}
.feed div{font-size:12px;background:#0b1017cc;border:1px solid var(--line);padding:3px 8px;border-radius:6px;animation:fin .25s}
@keyframes fin{from{opacity:0;transform:translateX(10px)}}
.inspect{position:absolute;left:10px;bottom:calc(64px + env(safe-area-inset-bottom));background:#0b1017e8;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px;display:none;max-width:260px;pointer-events:none}
.inspect b{font-size:14px}.inspect .ln{color:var(--dim)}
.banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:44px;font-weight:700;letter-spacing:.2em;pointer-events:none;text-shadow:0 0 30px currentColor;opacity:0;transition:opacity .3s}
.res-h{text-align:center;font-size:34px;letter-spacing:.18em;font-weight:700}
.money{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px;margin:10px 0;padding:10px 12px;background:#0d1116;border:1px solid var(--line);border-radius:10px}
.money b{font-family:'JetBrains Mono';text-align:right}
.money .tot{border-top:1px solid var(--line);padding-top:5px;font-weight:700}
.badge{font-size:10.5px;padding:1px 6px;border-radius:4px;background:#2a2110;color:var(--amber);border:1px solid #5a4210;margin-left:4px;font-family:'Chakra Petch';white-space:nowrap}
.intro{max-width:520px;margin:10vh auto 0;text-align:center;padding:0 16px}
.intro h1{font-size:40px;letter-spacing:.08em;line-height:1}
.intro h1 span{color:var(--amber)}
.intro input{width:100%;margin:18px 0 10px;background:#0b0f14;border:1px solid var(--line);border-radius:10px;padding:13px;color:var(--text);font:700 18px 'Chakra Petch';text-align:center}
.help{font-size:13px;color:var(--dim);line-height:1.6}
.help b{color:var(--text)}
.empty{color:var(--dim);font-size:13px;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:10px}
#announce{position:absolute;left:0;right:0;top:20%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 10px}
.ann{font:700 17px 'Chakra Petch',sans-serif;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 0 16px currentColor,0 2px 0 #000;animation:annIn 2.6s forwards;background:#000a;padding:5px 14px;border-radius:6px;border:1px solid #ffffff18;text-align:center}
.ann.big{font-size:24px}
@keyframes annIn{0%{opacity:0;transform:scale(1.5)}8%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
#killcam{position:absolute;left:12px;top:52px;font:700 11px 'JetBrains Mono';letter-spacing:.2em;color:#ff5a5a;opacity:0;transition:opacity .15s;pointer-events:none}
#killcam.on{opacity:1}
#battle.kc::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px #000;border-top:28px solid #000c;border-bottom:28px solid #000c}
.perk{position:relative}.perk .ic{font-size:18px;float:right;opacity:.7}
.opt.lock{opacity:.45}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.mods{grid-template-columns:1fr}}
.modc{padding:10px;border-radius:10px;border:1px solid #4a3a6a;background:#1a1426}
.modc.b{border-color:#5a4210;background:#211a0e}
.modc .h{font-weight:700;font-size:14px}.modc .d{font-size:12px;color:var(--dim);margin-top:2px}
.nem{color:#ff6a6a;font-size:11.5px}
.szb{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font:700 11px 'JetBrains Mono',monospace;margin:0 2px;vertical-align:middle;border:1px solid}
.szS{color:#6fd3a0;border-color:#6fd3a088;background:#6fd3a014}.szM{color:#ffb020;border-color:#ffb02088;background:#ffb02014}.szL{color:#ff7a5c;border-color:#ff7a5c88;background:#ff7a5c14}
.ch{display:inline-flex;gap:4px;align-items:center;font:600 10.5px 'JetBrains Mono',monospace;padding:2px 6px;border-radius:5px;background:#0b0f14;border:1px solid var(--line);color:#c9d3df;margin:3px 4px 0 0;white-space:nowrap}
.ch b{color:#6f7d8f;font-weight:500;font-size:9.5px;letter-spacing:.05em}
.ty{display:inline-block;font:600 10px 'Chakra Petch';letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:5px;border:1px solid;margin:3px 4px 0 0}
.desc{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.chips2{line-height:1.2}
.legend{font-size:12px;color:var(--dim);margin:-2px 0 8px}
.opt-l{font-size:9.5px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 5px;letter-spacing:.08em;margin-left:4px}
.advice{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.advice .role{padding:9px 11px;border-radius:9px;background:#141b24;border:1px solid var(--line)}
.advice .role b{display:block;font-size:14px;letter-spacing:.04em}.advice .role span{font-size:12px;color:var(--dim)}
.adv{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:7px 10px;border-radius:8px;line-height:1.35}
.adv i{font-style:normal;flex:none;width:14px;text-align:center}
.adv.bad{background:#2a1218;border:1px solid #5a2330;color:#ffb3bf}.adv.warn{background:#2a2110;border:1px solid #5a4210;color:#ffd890}.adv.tip{background:#101820;border:1px solid var(--line);color:#a9b8c9}.adv.good{background:#0f2621;border:1px solid #1f5a4e;color:var(--teal);font-weight:600}
.btabs{position:sticky;top:58px;z-index:2;background:var(--bg);padding:6px 0;margin-bottom:8px}
.btabs button{padding:9px 4px;font-size:11.5px}
.dotn{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:8px;background:var(--amber);color:#1a1205;font-size:10px;margin-left:3px}
.recgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.recgrid div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center}.recgrid b{display:block;font-size:16px}.recgrid span{font-size:10.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
@media(max-width:520px){.recgrid{grid-template-columns:repeat(2,1fr)}}
.steps{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.stepc{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:#1c1a12;border:1px solid #5a4210;font-size:13.5px}
.stepc .si{font-size:18px;color:var(--amber)}
.helpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.hbtn{display:flex;gap:8px;align-items:center;text-align:left;padding:10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:600}
.hbtn span{font-size:16px;width:20px;text-align:center}
.help-d{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--panel2)}
.help-d summary{padding:12px;font-weight:700;font-size:14.5px;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center}
.help-d summary::-webkit-details-marker{display:none}.help-d summary::after{content:"＋";margin-left:auto;color:var(--dim)}.help-d[open] summary::after{content:"－"}
.help-d .hi{width:22px;text-align:center}
.help-d .help{padding:0 14px 12px}.help-d .help p{margin:6px 0}.help-d .help ul{margin:6px 0 6px 18px}.help-d .help li{margin:3px 0}
.tut{text-align:center;padding:6px 4px}.tut-ic{font-size:42px;margin:6px 0 8px}.tut h3{font-size:19px;margin-bottom:8px}.tut p{font-size:14.5px;line-height:1.55;color:#c9d3df;margin-bottom:14px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}.dots i{width:7px;height:7px;border-radius:4px;background:var(--line)}.dots i.on{background:var(--amber);width:18px}
#helpTop{font-weight:700;color:var(--amber)}
.tabs button{min-width:0;padding:10px 4px}
@media(max-width:420px){.tabs button{font-size:11px;letter-spacing:.04em}}
@media(max-width:859px){#bPrev{aspect-ratio:16/9;max-height:220px}.stats{gap:6px 10px}}

/* ===== v5: sleek square theme ===== */
*,*::before,*::after{border-radius:0!important}
:root{--bg:#0a0c0f;--panel:#12161b;--panel2:#181d24;--line:#29313c;--line2:#3a4553;--text:#eef2f6;--dim:#9ba7b6;--amber:#ffb020}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.btn,.chip,.tabs button,#nav button,.sect,.rank,.lbl,.res-h,.banner,.ann,.tag,.ty,.opt b,.hbtn,.help-d summary,.pill,.team,.nm,.tut h3,.clock small,.trophy,.badge,.check{font-family:'Chakra Petch',sans-serif}
.screen{background:var(--bg)}.screen::before{display:none}
#topbar{background:#0d1014;border-bottom:1px solid var(--line)}
#nav{background:#0d1014;border-top:1px solid var(--line);backdrop-filter:none}
#nav button{font-size:11px;letter-spacing:.14em;border-top:2px solid transparent}
#nav button.on{color:var(--amber);border-top-color:var(--amber);background:#15120a}
h2{font-size:21px;letter-spacing:.1em}
h3{font-size:15px;letter-spacing:.1em}
.sect{color:#c3ccd7;font-weight:600;font-size:11.5px;letter-spacing:.18em;margin:20px 0 10px}
.sect::after{background:var(--line)}
.dim{color:var(--dim)}.small{font-size:12.5px}
.card,.slot,.prow,.pick,.opt,.modc,.stepc,.hbtn,.help-d,.recgrid div,.money,.empty,.ladder div,.league .crest,.advice .role,.adv{background:var(--panel);border:1px solid var(--line);box-shadow:none}
.card{padding:14px}
.btn{background:var(--panel2);border:1px solid var(--line2);letter-spacing:.1em;font-size:13px;padding:11px 16px;font-weight:700;transition:background .12s,border-color .12s}
.btn:hover{border-color:#566477}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#14100a;box-shadow:none}
.btn.primary:hover{background:#ffc040}
.btn.small{padding:8px 12px;font-size:12px}
.btn.danger{background:transparent;border-color:#5a2330;color:#ff6b80}
.btn.ghost{background:transparent;border-color:transparent}
.pill{background:var(--panel2);border:1px solid var(--line);font-size:13px;padding:6px 10px}
.chip{background:var(--panel);border:1px solid var(--line);color:#c3ccd7;font-size:13px;padding:8px 12px;letter-spacing:.03em}
.chip.on,.opt.on,.tabs button.on{background:#1d1709;border-color:var(--amber);color:var(--text);box-shadow:inset 3px 0 0 var(--amber)}
.tabs{gap:0;border:1px solid var(--line)}
.tabs button{border:none;border-right:1px solid var(--line);background:var(--panel);font-size:12px;letter-spacing:.12em;padding:11px 4px}
.tabs button:last-child{border-right:none}
.tabs button.on{box-shadow:inset 0 -3px 0 var(--amber)}
.opt{padding:10px 11px}.opt b{font-size:14px;letter-spacing:.03em}.opt small{font-size:12px;color:var(--dim);margin-top:3px}
.slot{border-left:3px solid var(--line2);padding:10px;margin-bottom:6px}
.slot.empty{border-left-color:var(--amber);background:#14120c}
.slot .lbl{font-size:10.5px;letter-spacing:.16em;color:var(--dim)}
.slot .pn,.prow .pn{font-family:'Inter',sans-serif;font-weight:600;font-size:15px;letter-spacing:0}
.prow{border-left:3px solid var(--line2);padding:11px;margin-bottom:6px;align-items:flex-start}
.prow canvas,.slot canvas{border:1px solid var(--line)}
.prow .pr{align-self:center}
.prow.locked{opacity:.45}
.af{color:#8fc3ff;font-size:12px;margin-top:2px}
.pdesc{font-size:13px;color:#d3dae3;line-height:1.4;margin:3px 0 6px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:4px}
.kv div{background:#0e1216;padding:5px 7px;display:flex;flex-direction:column;gap:1px;min-width:0}
.kv span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#7f8b9b;font-weight:600}
.kv b{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv .szb{margin:0 3px 0 0;width:16px;height:16px;font-size:10px}
.chips2{line-height:1.3}
.szb{border-width:1px}
.bar{height:6px;background:#0b0e12;border:1px solid var(--line)}
.meter .k,.stat .k{font-size:12px}
.stat .k b,.meter .k b{font-size:12.5px}
.bot canvas,.pick canvas,#bPrev{border:1px solid var(--line)}
.bot.add{border:1px dashed var(--line2);background:transparent}
.bhead{background:#0d1014;border-bottom:1px solid var(--line);backdrop-filter:none}
.bhead input,.intro input{background:#0b0e12;border:1px solid var(--line2);font-family:'Inter',sans-serif;font-weight:600}
.sheet{background:#11151a;border:1px solid var(--line2);border-top:3px solid var(--amber)}
.sheet-h{background:#11151a;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.modal{background:#000c}
.advice .role{border-left:3px solid #4da3ff}
.adv{border-width:1px;border-left-width:3px}
.adv.bad{background:#1c1014;border-color:#5a2330;border-left-color:#ff5a72}
.adv.warn{background:#1c170c;border-color:#5a4210;border-left-color:var(--amber)}
.adv.tip{background:var(--panel);border-color:var(--line);border-left-color:#5b6b80}
.adv.good{background:#0e1d1a;border-color:#1f5a4e;border-left-color:var(--teal)}
.stepc{background:#16130b;border-color:#4a3a12;border-left:3px solid var(--amber)}
.ladder{gap:4px}.ladder div{font-size:11px;padding:8px 3px}
.ladder div.cur{background:#1d1709;border-color:var(--amber)}
.ladder div.done{border-color:#1f5a4e;color:var(--teal)}
.trophy{background:#1a1509;border:1px solid #4a3a12}
.money{background:#0e1216}
.badge{background:#1a1509;border:1px solid #4a3a12}
.help-d summary{font-size:14px;letter-spacing:.04em}
.help-d .help{font-size:13.5px;line-height:1.55;color:#cfd6df}
.feed div,.inspect,.ctrls{background:#0b0e12ee;border:1px solid var(--line)}
.ann{background:#000c;border:1px solid #ffffff22}
.sw{border:1px solid #0008;box-shadow:inset 0 0 0 1px #ffffff22}
.sw.on{outline:2px solid #fff;outline-offset:2px}
.t td{border-top:1px solid var(--line)}
.warnline{font-size:12.5px}
input[type=range]{accent-color:var(--amber)}

@media(max-width:600px){
 .prow{flex-wrap:wrap}.prow>.grow{flex:1 1 calc(100% - 66px)}
 .prow .pr{flex:1 1 100%;display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:8px;text-align:right}
 .prow .pr br{display:none}
 .kv{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
 .btabs button{font-size:10.5px;letter-spacing:.06em;padding:11px 2px}
 .tabs button{letter-spacing:.06em}
}
.slot .kv{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}

.kv{background:none;border:none;gap:3px}
.kv div{border:1px solid var(--line)}
.slot.empty{text-align:left;padding:10px;font-size:inherit;color:inherit;border:1px solid var(--line);border-left:3px solid var(--amber)}
@media(max-width:600px){.prow>:last-child:not(.grow):not(canvas):not(.pr){margin-left:auto;margin-top:8px}}
</style>
</head>
